[package]
name = "mitelop"
version = "0.1.0"
description = "Mitelop - broadcast widget overlay"
authors = ["elzup"]
license = ""
repository = "https://github.com/elzup/mitelop"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api: 透過ウィンドウ (オーバーレイ) に必要
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
